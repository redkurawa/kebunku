<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image - KebunKU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #15803d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      font-size: 64px;
    }
    h1 {
      font-size: 72px;
      font-weight: bold;
      color: white;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: -2px;
    }
    p {
      font-size: 36px;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      font-weight: 400;
    }
    .footer {
      position: absolute;
      bottom: 40px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .footer-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .footer-text {
      font-size: 20px;
      color: white;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="icon">🌱</div>
  <h1>KebunKU</h1>
  <p>Digital Garden Diary</p>
  <div class="footer">
    <div class="footer-icon">🌿</div>
    <span class="footer-text">kebunqu.vercel.app</span>
  </div>
</body>
</html>
